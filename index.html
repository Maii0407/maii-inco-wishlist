<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f4">
  <link rel="icon" href="koromon.ico" type="image/x-icon">
  <title>maii wishlist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
  <script src="greymon.js" defer></script>
</head>
<body class="min-h-screen bg-stone-100 px-4 py-8 font-sans text-stone-900 sm:px-6 sm:py-16">
  <main class="mx-auto max-w-6xl">
    <div class="grid gap-6 lg:grid-cols-[minmax(16rem,0.8fr)_minmax(0,1.5fr)]">
      <section class="rounded-xl border border-stone-200 bg-white p-5 shadow-sm sm:p-7" aria-labelledby="wishlist-title">
        <h1 id="wishlist-title" class="text-2xl font-semibold tracking-tight">maii wishlist</h1>
        <ul id="wishlist-items" class="mt-5 divide-y divide-stone-100" aria-label="Wishlist links"></ul>
        <div class="mt-5 flex min-h-64 items-center justify-center overflow-hidden rounded-lg bg-stone-50 px-2 py-3" role="img" aria-label="A three-dimensional ASCII gift box rotating in place">
          <pre id="gift-box" class="gift-box-output whitespace-pre text-center font-mono" aria-hidden="true"></pre>
        </div>
        <div id="greymon-sprite" class="mt-5 flex min-h-48 items-center justify-center overflow-hidden rounded-lg p-4" role="img" aria-label="Animated grayscale Greymon pixel sprite"></div>
      </section>
      <section class="flex items-center justify-center overflow-hidden rounded-xl border border-stone-200 bg-white shadow-sm" aria-label="Spinning artwork">
        <div class="spinner-stage w-full overflow-hidden rounded-lg bg-stone-50">
          <img src="spinner.svg" class="spinner-art mx-auto block h-auto w-full" alt="Spinning ASCII art illustration">
        </div>
      </section>
    </div>
  </main>
</body>
</html>
