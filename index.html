<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My List</title>
  <style>
    body {
      max-width: 560px;
      margin: 60px auto;
      padding: 0 20px;
      font-family: system-ui, sans-serif;
      color: #222;
      background: #f6f7f4;
    }

    main {
      padding: 28px;
      background: white;
      border: 1px solid #e4e7e1;
      border-radius: 12px;
    }

    h1 {
      margin: 0 0 20px;
    }

    form {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 11px;
      border: 1px solid #cbd1c8;
      border-radius: 6px;
      font: inherit;
    }

    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 6px;
      font: inherit;
      cursor: pointer;
    }

    form button {
      color: white;
      background: #286447;
    }

    ul {
      padding: 0;
      margin: 20px 0 0;
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #edf0eb;
    }

    li span {
      flex: 1;
      overflow-wrap: anywhere;
    }

    li.done span {
      color: #778078;
      text-decoration: line-through;
    }

    .remove {
      color: #8b3333;
      background: #f8eeee;
    }

    #empty-message {
      color: #778078;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        margin-top: 24px;
      }

      main {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>My List</h1>

    <form id="item-form">
      <input
        id="item-input"
        type="text"
        placeholder="Add an item..."
        aria-label="New list item"
        required
      >
      <button type="submit">Add</button>
    </form>

    <p id="empty-message">Your list is empty.</p>
    <ul id="item-list" aria-label="List items"></ul>
  </main>

  <script>
    const storageKey = "my-simple-list";
    const form = document.querySelector("#item-form");
    const input = document.querySelector("#item-input");
    const list = document.querySelector("#item-list");
    const emptyMessage = document.querySelector("#empty-message");

    let items = [];

    try {
      const savedItems = JSON.parse(localStorage.getItem(storageKey));
      if (Array.isArray(savedItems)) items = savedItems;
    } catch {
      items = [];
    }

    function saveItems() {
      localStorage.setItem(storageKey, JSON.stringify(items));
    }

    function renderItems() {
      list.replaceChildren();
      emptyMessage.hidden = items.length > 0;

      for (const item of items) {
        const row = document.createElement("li");
        row.className = item.done ? "done" : "";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = item.done;
        checkbox.setAttribute("aria-label", `Mark ${item.text} complete`);
        checkbox.addEventListener("change", () => {
          item.done = checkbox.checked;
          saveItems();
          renderItems();
        });

        const text = document.createElement("span");
        text.textContent = item.text;

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.className = "remove";
        removeButton.textContent = "Remove";
        removeButton.setAttribute("aria-label", `Remove ${item.text}`);
        removeButton.addEventListener("click", () => {
          items = items.filter((other) => other.id !== item.id);
          saveItems();
          renderItems();
        });

        row.append(checkbox, text, removeButton);
        list.append(row);
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      items.push({
        id: `${Date.now()}-${Math.random()}`,
        text,
        done: false
      });

      saveItems();
      renderItems();
      form.reset();
      input.focus();
    });

    renderItems();
  </script>
</body>
</html>
